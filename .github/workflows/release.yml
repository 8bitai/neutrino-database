name: release

# The release train: pushing a tag vX.Y.Z builds the migration image and fans
# out a repository_dispatch to every service repo so they rebuild against the
# new tag. RULE: a schema-changing tag must roll out to ALL services — never
# deploy the migrate Job on one tag while services run another.

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

env:
  ACR: crneutrinoprodcin001.azurecr.io
  IMAGE: neutrino-database-migrate

jobs:
  build-migrate-image:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: 8894cdbc-d458-44ed-b8dc-1b42ee827bf8
          tenant-id: 713c9459-4056-4b3e-9162-591d6d67b03b
          subscription-id: 9501c581-8593-4b5d-ba3a-9f0aee32b481

      - name: ACR login
        run: az acr login --name crneutrinoprodcin001

      - name: Build and push migrate image
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build -t "$ACR/$IMAGE:$TAG" .
          docker push "$ACR/$IMAGE:$TAG"

  fan-out:
    needs: build-migrate-image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - Neutrino-Engine/neutrino-gateway
          - Neutrino-Engine/connector-service
          - Neutrino-Engine/ES-Ingestion-Service
          - Neutrino-Engine/agent-platform
          - Neutrino-Engine/neutrino-workflow-service
    steps:
      - name: Dispatch rebuild to ${{ matrix.repo }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ matrix.repo }}/dispatches" \
            -d "{\"event_type\":\"neutrino-database-release\",\"client_payload\":{\"ref\":\"${GITHUB_REF_NAME}\"}}"
